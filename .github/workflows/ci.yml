name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Build
        run: npm run build
        env:
          # Valores ficticios: el build no se conecta a Supabase ni a SES,
          # pero los clientes se inicializan al importar los módulos.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
          APP_AWS_REGION: us-east-1
          APP_AWS_ACCESS_KEY_ID: ci-placeholder
          APP_AWS_SECRET_ACCESS_KEY: ci-placeholder
          SES_FROM_EMAIL: ci@example.com
          ADMIN_EMAIL: ci@example.com
